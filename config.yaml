# Configuração do scanner de tendência para micro trading em cripto.
# Todos os valores aqui podem ser ajustados sem tocar no código.

quote_asset: USDT          # moeda de cotação dos pares monitorados (ex: BTCUSDT)

# Janela de tempo dos candles usada para medir o momentum de curto prazo.
# Valores aceitos pela Binance: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d ...
timeframe: 15m

# Considera "recém-lançada" toda moeda cujo primeiro candle diário
# tenha menos que este número de dias.
max_listing_age_days: 60

# Quantos candles do timeframe acima olhar para trás ao calcular a variação.
lookback_candles: 8

# Variação mínima de preço (%) no período de lookback para considerar tendência de alta.
min_price_change_pct: 8.0

# Volume do candle mais recente precisa ser pelo menos N vezes a média
# dos candles anteriores do lookback (detecta "explosão" de interesse).
min_volume_spike_ratio: 2.0

# Depois de alertar uma moeda, espera esse tempo antes de alertar de novo,
# mesmo que o sinal continue ativo (evita spam).
cooldown_hours: 4

# Intervalo entre varreduras do mercado.
scan_interval_seconds: 60

# A cada quantos ciclos de varredura a lista de pares/idade de listagem é atualizada
# (para pegar moedas novas que acabaram de estrear na exchange).
refresh_listings_every_cycles: 30

# ── Radar de notícias (módulo separado: python news_main.py, ou o dashboard
# via server.py) ──────────────────────────────────────────────────────────────
# Usa a API da Groq (console.groq.com — não confundir com a Grok/xAI, são
# serviços diferentes) com um modelo gpt-oss + ferramenta browser_search (busca
# web feita pela Groq), para achar notícias com potencial de movimento de preço. CADA
# CICLO CUSTA DINHEIRO (tokens + as buscas feitas pelo modelo), então os
# intervalos são bem maiores que o do scanner de preço — e o mercado B3 roda
# com menos frequência que o de cripto (não faz sentido varrer fora do
# horário de pregão).
#
# Cada bloco em `markets:` é um mercado independente (chave precisa bater com
# um `MarketProfile` em src/markets.py). Todos os campos abaixo podem ser
# omitidos por mercado — nesse caso caem no default indicado.
news:
  # A linha "groq/compound*" (busca embutida) foi descontinuada pela Groq em
  # 21/09/2026 e passou a dar 404. Substituto: gpt-oss com a ferramenta
  # browser_search, que o src/groq_client.py liga sozinho para ids "openai/gpt-oss*".
  model: openai/gpt-oss-120b   # modelo da Groq com busca web via browser_search, usado por todos os mercados

  # Fuso dos horários `run_at` abaixo (a VM está em America/Manaus; declarar o fuso
  # aqui evita depender do relógio do servidor).
  timezone: America/Sao_Paulo

  # Cada mercado roda em HORÁRIOS FIXOS (`run_at` + `days`) em vez de a cada N
  # minutos: a cota diária da Groq para o modelo é de ~200 mil tokens e cada busca
  # web gasta ~35 mil, então só cabem ~5-6 ciclos por dia — melhor gastá-los
  # quando as notícias saem do que de madrugada ou no fim de semana.
  #   run_at:             lista de "HH:MM" no fuso acima
  #   days:               dias da semana ("mon-fri", "mon-sun", "mon,wed,fri"...)
  #   lookback_hours:     janela MÍNIMA de notícias; com `run_at`, a janela real é o
  #                       tempo desde o ciclo anterior (ex: segunda cobre o fim de
  #                       semana), limitada por `max_lookback_hours` (padrão 96)
  # Sem `run_at`, vale o modo antigo: `scan_interval_minutes` (roda também no start).
  markets:
    crypto:
      run_at: ["07:00", "12:00"]  # 07h: madrugada/Ásia; 12h: abertura de Nova York (ETFs, regulação)
      days: mon-sun               # cripto negocia 24/7
      lookback_hours: 12
      max_opportunities: 5        # máximo de oportunidades pedidas por ciclo
      min_confidence: 6           # descarta oportunidades com confiança < N (escala 1-10)
      cooldown_hours: 12          # não repete alerta do mesmo ativo antes desse prazo

    altcoins:
      run_at: ["20:00"]           # narrativas de nicho: uma varredura ao fim do dia
      days: mon-sun
      lookback_hours: 6
      max_opportunities: 5
      min_confidence: 6           # mesma régua de confiança do cripto — não afrouxa por ser pequena
      cooldown_hours: 12

    b3:
      run_at: ["08:00", "18:30"]  # 08h: relatórios de bancos antes da abertura; 18h30: balanços/fatos relevantes pós-pregão
      days: mon-fri               # pregão: 10h-17h, só dias úteis
      lookback_hours: 12
      max_opportunities: 5
      min_confidence: 6
      cooldown_hours: 24

    b3_smallcaps:
      run_at: ["18:45"]           # pós-pregão (15 min depois do b3, pra não competir pelo limite de tokens/min)
      days: mon-fri
      lookback_hours: 12
      max_opportunities: 5
      min_confidence: 6           # mesma régua — não afrouxa por ser small cap
      cooldown_hours: 24
